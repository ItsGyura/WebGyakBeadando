<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Gyakorlati Beadandó</title>
    <link rel="stylesheet" href="style.css">
    <script src="menu.js"></script>
</head>
<body>
    <div class="tablazat auth-box">
        <h2>Regisztráció</h2>
        <p id="reg-message" class="auth-message" aria-live="polite"></p>
        <form action="reg.php" method="post">
            <label for="felhasznalonev">Felhasználónév:</label>
            <input type="text" id="felhasznalonev" name="felhasznalo" autocomplete="username">
            <br><br>
            <label for="jelszo">Jelszó:</label>
            <input type="password" id="jelszo" name="jelszo" autocomplete="new-password">
            <br><br>
            <label for="vezeteknev">Vezetéknév:</label>
            <input type="text" id="vezeteknev" name="vezeteknev">
            <br><br>
            <label for="utonev">Keresztnév:</label>
            <input type="text" id="utonev" name="utonev">
            <br><br>
            <div>
                <button class="gomb" type="submit">Regisztráció</button>
                <a id="megse" href="bejelentkezes.html">Mégsem</a>
            </div>
        </form>
    </div>

<script>
    const params = new URLSearchParams(window.location.search);
    const message = document.getElementById('reg-message');

    if (params.get('reg') === 'foglalt') {
        message.textContent = 'Ez a felhasználónév már foglalt.';
    } else if (params.get('reg') === 'hibas') {
        message.textContent = 'Minden mezőt ki kell tölteni.';
    } else if (params.get('reg') === 'hiba') {
        message.textContent = 'A regisztráció közben hiba történt.';
    }
</script>
</body>
</html>
